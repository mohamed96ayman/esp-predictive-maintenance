[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "esp-predictive-maintenance"
version = "1.0.0"
description = "SPE ESP failure-risk benchmark and local inference service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.4.3", "scikit-learn==1.8.0", "scipy==1.17.1",
  "joblib==1.5.3", "threadpoolctl==3.6.0",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
]

[project.optional-dependencies]
training = ["pandas==2.3.3", "pyarrow==24.0.0", "mlflow>=3,<4"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[project.scripts]
esp-pdm = "esp_pdm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
  mlflow:
    build:
      context: .
      target: tracking
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    volumes:
      - tracking:/tracking
    init: true
    restart: unless-stopped
volumes:
  tracking:
